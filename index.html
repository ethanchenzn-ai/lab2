<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Study Break</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>

  <!-- Opening -->
  <h1>Study Break</h1>
  <p>Take a short break and interact with the page.</p>

  <!-- Study box -->
  <div id="box">
    <h2 id="title">Keep Going!</h2>
    <p id="emoji">📚</p>
  </div>

  <!-- Buttons -->
  <button id="colorButton">Change Color</button>
  <button id="textButton">Change Message</button>

  <!-- Keyboard -->
  <p>Press the space key.</p>
  <p id="result"></p>

  <!-- Window -->
  <p id="windowSize"></p>

</body>

</html>
